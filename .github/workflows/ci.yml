name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    strategy:
      # One runner failing should not hide what the other one saw: the pair of results is what
      # separates an environment problem from a code problem.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gradlew: ./gradlew
          - os: windows-latest
            gradlew: ./gradlew.bat
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The JVM is taken from JAVA_HOME (exported by this action), not from a
      # machine-specific org.gradle.java.home path in gradle.properties, so the
      # build behaves identically on every machine and runner.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Deterministic, SDK-light task set: JVM engine tests, the desktop database
      # migration test, and the Android debug APK. The Android SDK is preinstalled on
      # the GitHub runners; AGP downloads any missing platform if needed.
      # Hypothesis, not a conclusion: the same task set passes on windows-latest and fails on
      # ubuntu-latest, so the difference is the runner's environment rather than the code. This
      # project compiles against a very new SDK platform, which the ubuntu image may not carry; the
      # step records what the image has and accepts the licences so the build can fetch what it
      # needs. It is scoped to Linux and cannot affect the Windows leg. If the failure is something
      # else, the printed listing is the evidence for the next attempt.
      - name: Prepare the Android SDK (Linux only)
        if: runner.os == 'Linux'
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          ls "${ANDROID_HOME}/platforms" 2>/dev/null || echo "no platforms directory"
          ls "${ANDROID_HOME}/build-tools" 2>/dev/null || echo "no build-tools directory"
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-36" > /dev/null 2>&1 || echo "platform install attempt finished with a nonzero status"
          else
            echo "sdkmanager not found at $SDKM"
          fi

      # The technical reference is generated from the sources. This step fails the build if the
      # document stops covering a calculator or drops its Arabic sections, which happened silently
      # once before.
      - name: Check the generated technical reference
        run: python tools/docs/selfcheck.py

      - name: Build and test
        run: ${{ matrix.gradlew }} :core:jvmTest :composeApp:desktopTest :composeApp:assembleDebug --console=plain
